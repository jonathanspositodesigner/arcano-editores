# Versão BASE do Arcano Motion no navegador (plugin/), o "instalador" do navegador.
# Depois dela o próprio painel se atualiza igual ao After: vê a versão nova no latest.json do ArcanoApp,
# mostra "Baixar e instalar" e guarda o zip publicado no cache do navegador (sw.js). Não roda sozinho:
# só quando alguém mandar (ex.: mudou o shim/sw.js e quer que quem abre pela 1ª vez já pegue a nova).
name: Base do plugin no navegador

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { path: site }
      - name: Gerar a base com o zip publicado
        run: |
          set -euo pipefail
          SITE=https://arcanoapp.voxvisual.com.br/downloads/arcano-motion
          curl -fsSL "$SITE/latest.json?t=$(date +%s)" -o latest.json
          V=$(jq -r .versao latest.json)
          curl -fsSL "$(jq -r .zip.url latest.json)" -o plugin.zip
          echo "$(jq -r .zip.sha256 latest.json)  plugin.zip" | sha256sum -c -
          mkdir fonte && unzip -q plugin.zip -d fonte
          grep -q "var VERSAO = '$V'" fonte/com.arcano.motion/js/app.js
          bash fonte/com.arcano.motion/web/gerar-espelho.sh "$PWD/site/plugin" "$V"
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Publicar
        run: |
          cd site
          git config user.name "arcano-build"
          git config user.email "arcano-build@users.noreply.github.com"
          git add -A plugin
          git diff --cached --quiet && exit 0
          git commit -m "Base do plugin no navegador ${V}"
          git pull --rebase -q && git push
