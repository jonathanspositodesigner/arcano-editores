# Ferramenta de linha de comando do editor de imagem (Linux), para testar a camada "Photoshop"
# do painel Arcano Design (photocraft-cli serve) e listar os comandos do editor.
name: CLI imagem

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { path: site }
      - name: Versão
        run: cat site/versoes.env >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: storytold/photocraft
          ref: ${{ env.PHOTOCRAFT_REF }}
          path: src
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: cli-imagem-${{ env.PHOTOCRAFT_REF }}
          cache-on-failure: true
      - name: Dependências
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libxdo-dev >/dev/null || true
      - name: Patches Arcano
        run: python3 site/patches/apply.py photocraft src
      - name: Compilar
        working-directory: src
        run: cargo build --release --locked -p photocraft-cli
      - name: Catálogo de comandos
        run: |
          mkdir -p saida
          cp src/target/release/photocraft-cli saida/
          src/target/release/photocraft-cli commands > saida/comandos.txt 2>&1 || true
          src/target/release/photocraft-cli commands --help > saida/comandos-ajuda.txt 2>&1 || true
          src/target/release/photocraft-cli serve --help > saida/serve-ajuda.txt 2>&1 || true
          ls -la saida
      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-cli
          path: saida/
